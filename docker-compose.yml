services:
  promeiro:
    # A imagem é construída a partir deste repositório; não existe em nenhum registro para baixar.
    build: .
    pull_policy: build
    container_name: promeiro
    restart: unless-stopped
    ports:
      - "${PORTA:-8080}:80"
    networks:
      # o nome antigo continua valendo, para um túnel que já aponte para http://roteirista:80
      default:
        aliases: [roteirista]
      # a rede do Teable no mesmo Docker, para ler as tabelas sem sair para a internet
      teable:
        aliases: [roteirista]
    depends_on:
      - redis
    volumes:
      # banco (roteirista.db) e backups diários (backup/) ficam aqui; use disco local, não pasta de rede
      # o volume e o banco guardam o nome antigo de propósito: renomear faria o app subir vazio
      - roteirista-dados:/dados
    environment:
      # Confere a assinatura do Cloudflare Access (recomendado). Sem isso, o servidor confia no e-mail
      # que o Access envia; nesse caso não publique a porta acima fora da sua rede.
      - ACCESS_TEAM_DOMAIN=${ACCESS_TEAM_DOMAIN:-}
      - ACCESS_AUD=${ACCESS_AUD:-}
      # 1 = sem login: cada pessoa se identifica com nome e e-mail no próprio app. Só para demonstração.
      - PERFIL_LOCAL=${PERFIL_LOCAL:-0}
      # aberto (padrão): todos veem, editam e apagam todos os roteiros. privado: cada um só vê os seus e os que recebeu.
      - ACESSO=${ACESSO:-aberto}
      # Cache e avisos da fila ao vivo. Sem Redis (ou com ele fora do ar) o app segue em memória.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # quantos backups diários manter
      - BACKUPS=${BACKUPS:-14}
      # Opcional: nomes da casa vindos do Teable (só leitura). Endereço do Teable na rede Docker
      # (http://NOME-DO-CONTAINER-DO-TEABLE:3000),
      # token de acesso só de leitura e os IDs das tabelas (tbl...) de atrações (KEY_atracoes) e de redatores.
      - TEABLE_URL=${TEABLE_URL:-}
      - TEABLE_TOKEN=${TEABLE_TOKEN:-}
      - TEABLE_ATRACOES=${TEABLE_ATRACOES:-}
      - TEABLE_REDATORES=${TEABLE_REDATORES:-}
      # cadastro de atrações (campos atracao e categoria): diz o que é novela e o que é esporte
      - TEABLE_CADASTRO=${TEABLE_CADASTRO:-}
      # editores (campo editor) e pauta da edição (campos key e editor), para preencher o editor pela claquete.
      # TEABLE_PAUTA_VISAO: ID (viw...) de uma visão da pauta que mostre só os dias recentes; sem ela, lê a tabela inteira.
      - TEABLE_EDITORES=${TEABLE_EDITORES:-}
      - TEABLE_PAUTA=${TEABLE_PAUTA:-}
      - TEABLE_PAUTA_VISAO=${TEABLE_PAUTA_VISAO:-}
      # Opcional, e melhor para a pauta: consultar direto o Postgres do Teable, com um usuário só de leitura.
      # URL no formato postgres://USUARIO:SENHA@teable-db:5432/BANCO; esquema é o ID da base; tabela é o nome interno.
      - TEABLE_PG_URL=${TEABLE_PG_URL:-}
      - TEABLE_PG_ESQUEMA=${TEABLE_PG_ESQUEMA:-}
      - TEABLE_PG_PAUTA=${TEABLE_PG_PAUTA:-}
      - TEABLE_CAMPO_CHAVE=${TEABLE_CAMPO_CHAVE:-}
      - TEABLE_CAMPO_ATRACAO=${TEABLE_CAMPO_ATRACAO:-}
      - TEABLE_CAMPO_REDATOR=${TEABLE_CAMPO_REDATOR:-}
      # ---- Envio para o Trello (no lugar do fluxo upload_roteiros do n8n) ----
      # Sem TRELLO_KEY, TRELLO_TOKEN e TRELLO_LISTA, o envio fica desligado e nada aparece na tela.
      - TRELLO_KEY=${TRELLO_KEY:-}
      - TRELLO_TOKEN=${TRELLO_TOKEN:-}
      # listas: padrão (G5 e RJ), SP e VT
      - TRELLO_LISTA=${TRELLO_LISTA:-}
      - TRELLO_LISTA_SP=${TRELLO_LISTA_SP:-}
      - TRELLO_LISTA_VT=${TRELLO_LISTA_VT:-}
      # campos personalizados do quadro (IDs) e as opções de praça no formato G5=id,SP=id,RJ=id
      - TRELLO_CAMPO_PRACA=${TRELLO_CAMPO_PRACA:-}
      - TRELLO_PRACAS=${TRELLO_PRACAS:-}
      - TRELLO_CAMPO_REDATOR=${TRELLO_CAMPO_REDATOR:-}
      - TRELLO_CAMPO_EDITOR=${TRELLO_CAMPO_EDITOR:-}
      - TRELLO_CAMPO_PRIORIDADE=${TRELLO_CAMPO_PRIORIDADE:-}
      - TRELLO_PRIORIDADE_ALTA=${TRELLO_PRIORIDADE_ALTA:-}
      - TRELLO_CAMPO_PROJETO=${TRELLO_CAMPO_PROJETO:-}
      - TRELLO_CAMPO_OUTPUT=${TRELLO_CAMPO_OUTPUT:-}
      - TRELLO_CAMPO_BOT=${TRELLO_CAMPO_BOT:-}
      - TRELLO_CAMPO_ENTRADA=${TRELLO_CAMPO_ENTRADA:-}
      # campos copiados do card do filme nas sessões (complexidade, uso de IA), separados por vírgula
      - TRELLO_CAMPOS_FILME=${TRELLO_CAMPOS_FILME:-}
      # Teable, escrita: token com permissão de criar registros na produção da arte e nos redatores
      - TEABLE_TOKEN_ESCRITA=${TEABLE_TOKEN_ESCRITA:-}
      - TEABLE_ARTE_PRODUCAO=${TEABLE_ARTE_PRODUCAO:-}
      # Postgres do Teable, leitura: nomes internos das tabelas (os mesmos do nó Globals do n8n)
      - TEABLE_PG_ARTE=${TEABLE_PG_ARTE:-}
      - TEABLE_PG_REDATORES=${TEABLE_PG_REDATORES:-}
      - TEABLE_PG_EDITORES=${TEABLE_PG_EDITORES:-}
      - TEABLE_PG_ATRACOES=${TEABLE_PG_ATRACOES:-}
      - TEABLE_PG_PRIORIDADE=${TEABLE_PG_PRIORIDADE:-}
      - TEABLE_PG_FILMES_ESQUEMA=${TEABLE_PG_FILMES_ESQUEMA:-}
      - TEABLE_PG_SESSOES=${TEABLE_PG_SESSOES:-}
      - TEABLE_PG_LOG_BOT=${TEABLE_PG_LOG_BOT:-}
      # cópia do arquivo original no OneDrive (SFTP). O PDF anexado ao card é gerado pelo próprio PROMeiro.
      - SFTP_HOST=${SFTP_HOST:-}
      - SFTP_PORTA=${SFTP_PORTA:-22}
      - SFTP_USUARIO=${SFTP_USUARIO:-}
      - SFTP_SENHA=${SFTP_SENHA:-}
      - SFTP_PASTA=${SFTP_PASTA:-/PROMO/WORKFLOWS/ROTEIROS}
      # endereço público, para o link do roteiro no registro da produção
      - PROMEIRO_URL=${PROMEIRO_URL:-}

  # Só cache: nada aqui precisa sobreviver a um reinício (o banco dos roteiros é o SQLite, no volume acima).
  redis:
    image: redis:7.4-alpine
    container_name: promeiro-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]

  # Opcional: túnel do Cloudflare só para este app.
  # Ative com o perfil "tunel" (COMPOSE_PROFILES=tunel) e informe TUNNEL_TOKEN.
  # Se você já tem um cloudflared rodando, não precisa deste serviço:
  # aponte um hostname do seu túnel para http://promeiro:80 (ou IP:PORTA).
  tunel:
    profiles: ["tunel"]
    image: cloudflare/cloudflared:latest
    container_name: promeiro-tunel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - promeiro

volumes:
  roteirista-dados:

networks:
  # Rede que já existe, criada pela stack do Teable. Outro nome: variável REDE_TEABLE.
  teable:
    external: true
    name: ${REDE_TEABLE:-teable-network}
