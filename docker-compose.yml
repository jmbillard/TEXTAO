services:
  promeiro:
    # A imagem é construída a partir deste repositório; não existe em nenhum registro para baixar.
    build: .
    pull_policy: build
    container_name: promeiro
    restart: unless-stopped
    ports:
      - "${PORTA:-8080}:80"
    networks:
      # o nome antigo continua valendo, para um túnel que já aponte para http://roteirista:80
      default:
        aliases: [roteirista]
      # a rede do Teable no mesmo Docker, para ler as tabelas sem sair para a internet
      teable:
        aliases: [roteirista]
      # a rede do n8n, onde está o Stirling-PDF (a conversão do PDF do card)
      n8n: {}
    depends_on:
      - redis
    volumes:
      # banco (roteirista.db) e backups diários (backup/) ficam aqui; use disco local, não pasta de rede
      # o volume e o banco guardam o nome antigo de propósito: renomear faria o app subir vazio
      - roteirista-dados:/dados
    environment:
      # As variáveis estão em blocos, na mesma ordem do stack.env.exemplo. Vazia = desligado.
      # Nomes de campo das tabelas (TEABLE_CAMPO_*), a pasta do OneDrive (SFTP_PASTA) e a porta do SFTP (SFTP_PORTA)
      # têm padrão no código. Só se o seu Teable for diferente: acrescente a linha aqui, como as de baixo.

      # ---- Acesso ----
      - ACCESS_TEAM_DOMAIN=${ACCESS_TEAM_DOMAIN:-}
      - ACCESS_AUD=${ACCESS_AUD:-}
      - PERFIL_LOCAL=${PERFIL_LOCAL:-0}
      - ACESSO=${ACESSO:-aberto}
      - PROMEIRO_URL=${PROMEIRO_URL:-}

      # ---- Servidor ----
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - BACKUPS=${BACKUPS:-14}

      # ---- Teable: API (lê e grava com o mesmo token) ----
      - TEABLE_URL=${TEABLE_URL:-}
      - TEABLE_TOKEN=${TEABLE_TOKEN:-}
      - TEABLE_ATRACOES=${TEABLE_ATRACOES:-}
      - TEABLE_CADASTRO=${TEABLE_CADASTRO:-}
      - TEABLE_REDATORES=${TEABLE_REDATORES:-}
      - TEABLE_EDITORES=${TEABLE_EDITORES:-}
      - TEABLE_KEY_EDITORES=${TEABLE_KEY_EDITORES:-}
      - TEABLE_KEY_REDATORES=${TEABLE_KEY_REDATORES:-}
      - TEABLE_PAUTA=${TEABLE_PAUTA:-}
      - TEABLE_ARTE_PRODUCAO=${TEABLE_ARTE_PRODUCAO:-}
      - TEABLE_ACERVO=${TEABLE_ACERVO:-}

      # ---- Teable: Postgres (só leitura; nomes internos das tabelas) ----
      - TEABLE_PG_URL=${TEABLE_PG_URL:-}
      - TEABLE_PG_ESQUEMA=${TEABLE_PG_ESQUEMA:-}
      - TEABLE_PG_PAUTA=${TEABLE_PG_PAUTA:-}
      - TEABLE_PG_ARTE=${TEABLE_PG_ARTE:-}
      - TEABLE_PG_ARTE_LEITURA=${TEABLE_PG_ARTE_LEITURA:-}
      - TEABLE_PG_ACERVO=${TEABLE_PG_ACERVO:-}
      - TEABLE_PG_REDATORES=${TEABLE_PG_REDATORES:-}
      - TEABLE_PG_EDITORES=${TEABLE_PG_EDITORES:-}
      - TEABLE_PG_ATRACOES=${TEABLE_PG_ATRACOES:-}
      - TEABLE_PG_PRIORIDADE=${TEABLE_PG_PRIORIDADE:-}
      - TEABLE_PG_EXIBICOES=${TEABLE_PG_EXIBICOES:-}
      - TEABLE_PG_FILMES=${TEABLE_PG_FILMES:-}
      # tabela dos filmes (id da API): o pôster do filme aparece no card da fila
      - TEABLE_FILMES=${TEABLE_FILMES:-}
      # o campo do pôster nos filmes e a tabela de exibições (id da API): onde o envio da aba Filmes grava
      - TEABLE_FILMES_POSTER=${TEABLE_FILMES_POSTER:-}
      - TEABLE_EXIBICOES=${TEABLE_EXIBICOES:-}

      # ---- Cadastros ----
      - CADASTRO_ADMINS=${CADASTRO_ADMINS:-}

      # ---- Trello ----
      - TRELLO_KEY=${TRELLO_KEY:-}
      - TRELLO_TOKEN=${TRELLO_TOKEN:-}
      - TRELLO_LISTA=${TRELLO_LISTA:-}
      - TRELLO_LISTA_SP=${TRELLO_LISTA_SP:-}
      - TRELLO_LISTA_RJ=${TRELLO_LISTA_RJ:-}
      - TRELLO_LISTA_G5=${TRELLO_LISTA_G5:-}
      - TRELLO_LISTA_INTER=${TRELLO_LISTA_INTER:-}
      - TRELLO_SAIDA_SP=${TRELLO_SAIDA_SP:-}
      - TRELLO_SAIDA_RJ=${TRELLO_SAIDA_RJ:-}
      - TRELLO_SAIDA_G5=${TRELLO_SAIDA_G5:-}
      - TRELLO_SAIDA_INTER=${TRELLO_SAIDA_INTER:-}
      - TRELLO_LISTA_VT=${TRELLO_LISTA_VT:-}
      - TRELLO_CAMPO_PRACA=${TRELLO_CAMPO_PRACA:-}
      - TRELLO_PRACAS=${TRELLO_PRACAS:-}
      - TRELLO_CAMPO_REDATOR=${TRELLO_CAMPO_REDATOR:-}
      - TRELLO_CAMPO_EDITOR=${TRELLO_CAMPO_EDITOR:-}
      - TRELLO_CAMPO_PRIORIDADE=${TRELLO_CAMPO_PRIORIDADE:-}
      - TRELLO_PRIORIDADE_ALTA=${TRELLO_PRIORIDADE_ALTA:-}
      - TRELLO_CAMPO_PROJETO=${TRELLO_CAMPO_PROJETO:-}
      - TRELLO_CAMPO_OUTPUT=${TRELLO_CAMPO_OUTPUT:-}
      - TRELLO_CAMPO_BOT=${TRELLO_CAMPO_BOT:-}
      - TRELLO_CAMPO_ENTRADA=${TRELLO_CAMPO_ENTRADA:-}
      # o campo Complexidade e as opções BAIXA,MÉDIA,ALTA (IDs); vazios = o card sai sem o campo
      - TRELLO_CAMPO_COMPLEXIDADE=${TRELLO_CAMPO_COMPLEXIDADE:-}
      - TRELLO_COMPLEXIDADE_OPCOES=${TRELLO_COMPLEXIDADE_OPCOES:-}
      - TRELLO_CAMPOS_FILME=${TRELLO_CAMPOS_FILME:-}
      # os cards de filme da aba Filmes: a lista (sem ela, o Enviar fica desligado), as etiquetas, a praça e a prioridade MÉDIA
      - TRELLO_LISTA_FILMES=${TRELLO_LISTA_FILMES:-}
      - TRELLO_FILMES_ETIQUETAS=${TRELLO_FILMES_ETIQUETAS:-}
      - TRELLO_FILMES_ETIQUETAS_SESSAO=${TRELLO_FILMES_ETIQUETAS_SESSAO:-}
      - TRELLO_FILMES_PRACA=${TRELLO_FILMES_PRACA:-}
      - TRELLO_PRIORIDADE_MEDIA=${TRELLO_PRIORIDADE_MEDIA:-}

      # ---- OneDrive (cópia do arquivo original, por SFTP) ----
      - SFTP_HOST=${SFTP_HOST:-}
      - SFTP_USUARIO=${SFTP_USUARIO:-}
      - SFTP_SENHA=${SFTP_SENHA:-}

      # ---- PDF do card: conversão fiel do original (Stirling-PDF; opcional) ----
      - STIRLING_URL=${STIRLING_URL:-}
      - STIRLING_CHAVE=${STIRLING_CHAVE:-}

      # ---- n8n: a aba Filmes (a leitura da prévia por IA; vazia, a aba fica desligada) ----
      - N8N_FILMES_LER=${N8N_FILMES_LER:-}
      - FILMES_INTERVALO_MS=${FILMES_INTERVALO_MS:-}
      - FILMES_TEMPO_MS=${FILMES_TEMPO_MS:-}

  # Só cache: nada aqui precisa sobreviver a um reinício (o banco dos roteiros é o SQLite, no volume acima).
  redis:
    image: redis:7.4-alpine
    container_name: promeiro-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]

  # Opcional: túnel do Cloudflare só para este app.
  # Ative com o perfil "tunel" (COMPOSE_PROFILES=tunel) e informe TUNNEL_TOKEN.
  # Se você já tem um cloudflared rodando, não precisa deste serviço:
  # aponte um hostname do seu túnel para http://promeiro:80 (ou IP:PORTA).
  tunel:
    profiles: ["tunel"]
    image: cloudflare/cloudflared:latest
    container_name: promeiro-tunel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - promeiro

volumes:
  roteirista-dados:

networks:
  # Rede que já existe, criada pela stack do Teable. Outro nome: variável REDE_TEABLE.
  teable:
    external: true
    name: ${REDE_TEABLE:-teable-network}
  # Rede que já existe, criada pela stack do n8n (lá está o Stirling-PDF). Outro nome: variável REDE_N8N.
  n8n:
    external: true
    name: ${REDE_N8N:-n8n-network}
